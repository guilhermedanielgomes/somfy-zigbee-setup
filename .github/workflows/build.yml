name: build executables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            extra: --collect-submodules winrt
          - os: macos-latest
            name: macos
            extra: ""
          - os: ubuntu-latest
            name: linux
            extra: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --name somfy-setup-${{ matrix.name }} --collect-submodules bleak ${{ matrix.extra }} somfy_setup.py
      - run: ./dist/somfy-setup-${{ matrix.name }} --help
        if: matrix.name != 'windows'
      - run: .\dist\somfy-setup-windows.exe --help
        if: matrix.name == 'windows'
      - uses: actions/upload-artifact@v4
        with:
          name: somfy-setup-${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
